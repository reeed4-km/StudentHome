{% extends "base.html" %}
{% block title %}Aide - StudentHome Marrakech{% endblock %}
{% block content %}
<section class="auth help-bg">
    <form class="form-card login-card" method="post">
        <div class="register-head">
            <div>
                <p class="tag">{{ t('nav_help') }}</p>
                <h1>{{ t('help_title') }}</h1>
            </div>
        </div>
        <p>{{ t('help_text') }}</p>

        <div class="login-grid">
            <div class="field">
                <label>{{ t('name') }}</label>
                <input type="text" value="{{ current_user.nom }}" readonly>
            </div>
            <div class="field">
                <label>{{ t('email') }}</label>
                <input type="email" value="{{ current_user.email }}" readonly>
            </div>
            <div class="field field-wide">
                <label>{{ t('subject') }}</label>
                <input type="text" name="sujet" placeholder="{{ t('help_subject_placeholder') }}" required>
            </div>
            <div class="field field-wide">
                <label>{{ t('message_or_comment') }}</label>
                <textarea name="contenu" placeholder="{{ t('help_message_placeholder') }}" required></textarea>
            </div>
        </div>

        <button class="btn btn-primary full login-submit" type="submit">{{ t('send_request') }}</button>
    </form>
</section>
{% endblock %}
