{% extends "base.html" %}
{% block title %}Nouveau mot de passe - StudentHome{% endblock %}
{% block content %}
<section class="auth">
    <form class="form-card login-card" method="post">
        <div class="register-head">
            <div>
                <p class="tag">Vérification</p>
                <h1>Nouveau mot de passe</h1>
            </div>
        </div>

        <p>Un code de vérification a été envoyé par {{ 'SMS' if reset_method == 'sms' else 'Gmail' }} vers {{ reset_destination }}.</p>

        <div class="login-grid">
            <div class="field field-wide">
                <label>Code de vérification</label>
                <input type="text" name="code" placeholder="Exemple : 123456" required>
            </div>
            <div class="field">
                <label>Nouveau mot de passe</label>
                <input type="password" name="mot_de_passe" placeholder="Mot de passe renforcé" required>
            </div>
            <div class="field">
                <label>Confirmer</label>
                <input type="password" name="confirmation" placeholder="Confirmer le mot de passe" required>
            </div>
        </div>

        <button class="btn btn-primary full" type="submit">Changer le mot de passe</button>
    </form>
</section>
{% endblock %}
