{% extends "base.html" %}
{% block title %}Contrat - StudentHome{% endblock %}
{% block content %}
<section class="auth">
    <form class="form-card" method="post">
        <p class="tag">Contrat PDF</p>
        <h1>{{ reservation.logement.titre }}</h1>
        <label>Durée</label>
        <select name="duree"><option value="9">9 mois</option><option value="10">10 mois</option><option value="12" selected>12 mois</option></select>
        <label>Caution</label>
        <select name="caution"><option value="1">1 mois</option><option value="2">2 mois</option></select>
        <label>Charges incluses</label>
        <select name="charges"><option value="oui">Oui</option><option value="non">Non</option></select>
        <button class="btn btn-primary full" type="submit">Générer le PDF</button>
    </form>
</section>
{% endblock %}
