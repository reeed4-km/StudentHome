{% extends "base.html" %}
{% block title %}Coffre-fort - StudentHome{% endblock %}
{% block content %}
<section class="section">
    <div class="section-title">
        <div>
            <p class="tag">Documents sécurisés</p>
            <h1>Coffre-fort numérique</h1>
        </div>
    </div>
    <form class="form-card wide" method="post" enctype="multipart/form-data">
        <div class="register-grid">
            <div class="field">
                <label>Type de document</label>
                <select name="type_document">
                    <option>Contrat</option>
                    <option>Quittance</option>
                    <option>Facture RADEEMA</option>
                    <option>Document personnel</option>
                </select>
            </div>
            <div class="field">
                <label>Fichier</label>
                <input type="file" name="document" required>
            </div>
        </div>
        <button class="btn btn-primary full" type="submit">Ajouter au coffre-fort</button>
    </form>
    <div class="table-wrap">
        <table>
            <thead><tr><th>Type</th><th>Date</th><th>Fichier</th></tr></thead>
            <tbody>
                {% for doc in documents %}
                    <tr><td>{{ doc.type_document }}</td><td>{{ doc.date_upload }}</td><td><a href="{{ url_for('static', filename=doc.fichier) }}">Ouvrir</a></td></tr>
                {% else %}
                    <tr><td colspan="3">Aucun document.</td></tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</section>
{% endblock %}
